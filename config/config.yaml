# Central configuration. All scripts read this file; CLI flags override it.
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  benchmark_dir: data/benchmark
  fixture_dir: data/fixture
  results_dir: outputs/results
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  paper_tables_dir: paper/tables
  paper_figures_dir: paper/figures

collection:
  limit: 1500            # max OpenML records to keep; use --limit 100 for a smoke test
  status: active
  min_description_chars: 40   # quality criterion used by clean_catalog.py
  request_pause_s: 0.2        # polite delay between per-dataset metadata requests
  max_retries: 3

model:
  name: sentence-transformers/all-MiniLM-L6-v2
  embedding_cache: data/processed/embeddings_minilm.npy
  batch_size: 64

retrieval:
  top_k: 5
  alpha_default: 0.7
  alpha_grid: [0.0, 0.25, 0.5, 0.7, 0.75, 1.0]
  hard_constraint_policy: penalize   # 'penalize' keeps item with failure flag; 'exclude' removes it
  hard_constraint_penalty: 0.5       # multiplicative factor on FinalScore when policy=penalize

benchmark:
  n_queries: 400
  split_fractions: {train: 0.5, validation: 0.2, test: 0.3}
  # Label provenance. Synthetic/metadata-derived labels are NEVER human-verified.
  annotation_source: synthetic_metadata_derived
